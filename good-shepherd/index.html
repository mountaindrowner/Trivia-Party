<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ninety-Nine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a 384×216 pixel stage scaled to fit, centered on a dark meadow ground. All UI sits in a 384×216 layer scaled with
   it: wood frames, parchment panels, a day clock and a resource strip, in the cozy farm-sim tradition. */
:root {
  --bark: #3e2416;
  --wood: #a8703f;
  --wood-hi: #d39a5c;
  --parch: #f7e7c4;
  --parch-dk: #e2c690;
  --ink: #3b2418;
  --muted: #8a6a4a;
  --accent: #8a4a22;
  --leaf: #5f9c3c;
  --sun: #f5c542;
  --rose: #d8574f;
  --dusk: #9fb4ff;
  --ground: #1d2a1c;
  --font: "Pixelify Sans", ui-rounded, "Trebuchet MS", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--parch); font-family: var(--font); font-variant-ligatures: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0;
  box-sizing: border-box; display: grid; place-items: center; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none;
}
#stage { position: relative; width: 384px; height: 216px; box-shadow: 0 0 0 3px var(--bark), 0 0 0 6px var(--wood), 0 0 0 8px var(--bark); }
#game { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; background: #2c4a26; }
#ui { position: absolute; left: 0; top: 0; width: 384px; height: 216px; transform-origin: 0 0; pointer-events: none; overflow: hidden; }
#ui > * { pointer-events: none; }
#ui button, #ui .clickable, #ui .panel, #ui .panel * { pointer-events: auto; }

.wood { background: var(--parch); color: var(--ink); box-shadow: inset 0 0 0 1px var(--parch-dk), 0 0 0 1px var(--bark), 0 0 0 3px var(--wood), 0 0 0 4px var(--bark), 0 3px 0 4px rgba(0, 0, 0, .25); }
.btn {
  font-family: var(--font); font-weight: 700; font-size: 8px; color: var(--parch); background: var(--wood); border: 0; padding: 3px 9px; cursor: pointer;
  box-shadow: inset 0 1px 0 var(--wood-hi), 0 0 0 1px var(--bark), 0 2px 0 1px var(--bark);
}
.btn:hover { filter: brightness(1.08); }
.btn:focus-visible { outline: 1px solid var(--sun); outline-offset: 2px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.forgive { background: #f2d27a; color: var(--ink); box-shadow: inset 0 1px 0 #fff2c4, 0 0 0 1px var(--bark), 0 2px 0 1px var(--bark); animation: glow 1.4s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: inset 0 1px 0 #fff2c4, 0 0 0 1px var(--bark), 0 2px 0 1px var(--bark), 0 0 8px 2px rgba(245, 197, 66, .8); } }

/* HUD: three small chips and a thin bar, so the world stays visible */
#hud { position: absolute; inset: 0; }
.xp { position: absolute; left: 0; right: 0; top: 0; height: 2px; background: rgba(30, 20, 10, .35); }
.xp i { display: block; height: 100%; width: 0; background: var(--rose); }
.goal { position: absolute; left: 6px; top: 6px; max-width: 190px; display: flex; gap: 5px; align-items: center; font-family: var(--font); font-size: 7.5px; padding: 2px 6px; border: 0; text-align: left; cursor: pointer; line-height: 1.2; }
.goal .lv { font-weight: 700; color: var(--accent); white-space: nowrap; }
.goal:focus-visible { outline: 1px solid var(--sun); outline-offset: 3px; }
.clock { position: absolute; right: 6px; top: 6px; padding: 2px 6px 3px; display: grid; grid-template-columns: auto auto auto; gap: 0 4px; align-items: center; font-size: 7.5px; line-height: 1.2; }
.clock b { font-weight: 700; }
.clock .time { font-variant-numeric: tabular-nums; }
.sunmoon { width: 7px; height: 7px; border-radius: 50%; background: var(--sun); box-shadow: 0 0 0 1px var(--bark); flex: none; }
.sunmoon.moon { background: #e8ecff; box-shadow: inset -2px -1px 0 #b7c0e8, 0 0 0 1px var(--bark); }
.dayfill { grid-column: 1 / -1; height: 2px; background: var(--parch-dk); margin-top: 2px; }
.dayfill i { display: block; height: 100%; width: 0; background: var(--sun); }
.dayfill i.night { background: var(--dusk); }
.res { position: absolute; left: 6px; bottom: 6px; padding: 2px 6px; display: flex; gap: 6px; font-size: 7px; font-variant-numeric: tabular-nums; align-items: center; }
.res span { display: flex; align-items: center; gap: 2px; white-space: nowrap; }
.res canvas { width: 9px; height: 9px; image-rendering: pixelated; flex: none; }
.res .low { color: var(--rose); font-weight: 700; }
.res .sep { width: 1px; align-self: stretch; background: var(--parch-dk); }
.prompt { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); font-size: 7.5px; padding: 2px 6px; white-space: nowrap; }
kbd { font-family: var(--font); font-weight: 700; font-size: .92em; background: var(--wood); color: var(--parch); padding: 0 3px; margin: 0 1px; box-shadow: 0 0 0 1px var(--bark); white-space: nowrap; }
.hold { height: 2px; background: var(--parch-dk); margin-top: 2px; }
.hold i { display: block; height: 100%; width: 0; background: var(--leaf); }
.tbar { position: absolute; right: 6px; bottom: 6px; display: flex; gap: 5px; }
.tbar .btn { font-size: 6.5px; padding: 2px 5px; }

/* Lessons and chapter explainers */
.lesson { width: 220px; padding: 8px 10px 9px; display: grid; gap: 5px; justify-items: center; text-align: center; }
.lesson .kind { font-size: 6px; color: var(--muted); letter-spacing: .6px; }
.lesson h3 { margin: 0; font-size: 11px; color: #6a3a1c; }
.lesson canvas { width: 96px; height: 48px; image-rendering: pixelated; background: #cfe3c4; box-shadow: 0 0 0 1px var(--parch-dk); }
.lesson p { margin: 0; font-size: 8px; line-height: 1.35; }
.lesson small { font-size: 6.5px; color: var(--muted); }
.news { display: grid; gap: 4px; text-align: left; width: 250px; }
.news div { display: grid; grid-template-columns: 34px 1fr; gap: 6px; align-items: center; font-size: 7.5px; line-height: 1.3; }
.news canvas { width: 34px; height: 24px; image-rendering: pixelated; background: #cfe3c4; box-shadow: 0 0 0 1px var(--parch-dk); }

/* Two-pane menus: a short list on the left, the chosen item's details on the right */
.split { display: grid; grid-template-columns: 128px 1fr; gap: 8px; min-height: 0; flex: 1; }
.split .list { overflow-y: auto; display: grid; gap: 2px; align-content: start; padding-right: 2px; }
.item { display: grid; grid-template-columns: 22px 1fr auto; gap: 4px; align-items: center; padding: 2px 3px; border: 0; background: #fbefd2; color: var(--ink); font-family: var(--font); font-size: 7.5px; text-align: left; cursor: pointer; }
.item canvas { width: 22px; height: 16px; image-rendering: pixelated; }
.item small { font-size: 6.5px; color: var(--muted); }
.item small.no { color: var(--rose); }
.item:hover, .item:focus-visible, .item.sel { background: #fff6dc; outline: 1px solid var(--wood); }
.dot { width: 5px; height: 5px; border-radius: 50%; background: var(--leaf); box-shadow: 0 0 0 1px var(--bark); }
.dot.warn { background: var(--sun); }
.dot.bad { background: var(--rose); }
.pane { overflow-y: auto; display: grid; gap: 4px; align-content: start; font-size: 8px; line-height: 1.35; }
.pane h3 { margin: 0; font-size: 10px; color: #6a3a1c; }
.pane .pic { width: 100%; height: 40px; image-rendering: pixelated; background: #cfe3c4; box-shadow: 0 0 0 1px var(--parch-dk); }
.pane .muted { color: var(--muted); font-size: 7px; }
.pane .need { display: grid; grid-template-columns: 9px 1fr; gap: 3px; font-size: 7.5px; }
.pane .need i { font-style: normal; font-weight: 700; color: var(--leaf); }
.pane .need i.x { color: var(--rose); }
.pane .bars { display: grid; grid-template-columns: 34px 1fr; gap: 2px 4px; align-items: center; font-size: 7px; }
.pane .bar { height: 4px; background: var(--parch-dk); }
.pane .bar i { display: block; height: 100%; background: var(--leaf); }
.pane .acts { display: flex; gap: 4px; flex-wrap: wrap; }
.pane .acts .btn { font-size: 7px; padding: 2px 6px; }
.cost { display: flex; gap: 6px; flex-wrap: wrap; font-size: 7.5px; }
.cost .no { color: var(--rose); font-weight: 700; }

#toast { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); max-width: 220px; text-align: center; font-size: 7.5px; line-height: 1.2; padding: 3px 6px; opacity: 0; transition: opacity .25s; }
#toast.on { opacity: 1; }
#tip { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); max-width: 148px; font-size: 7px; line-height: 1.25; padding: 3px 6px; text-align: center; opacity: 0; transition: opacity .3s; }
#tip.on { opacity: 1; }
#tip b { color: var(--accent); }
#banner { position: absolute; left: 0; right: 0; top: 64px; text-align: center; font-weight: 700; font-size: 18px; color: var(--parch); opacity: 0;
  text-shadow: 1px 0 0 var(--bark), -1px 0 0 var(--bark), 0 1px 0 var(--bark), 0 -1px 0 var(--bark), 0 3px 0 var(--bark); }
#banner small { display: block; font-size: 8px; font-weight: 500; margin-top: 4px; }
#banner.on { animation: bannerIn 2.8s steps(28) forwards; }
@keyframes bannerIn { 0% { opacity: 0; transform: translateY(6px); } 12% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; } }
#report { position: absolute; left: 8px; bottom: 34px; width: 116px; padding: 4px 6px; font-size: 6.5px; line-height: 1.3; opacity: 0; transition: opacity .4s; }
#report.on { opacity: 1; }
#report b { display: block; font-size: 7px; color: var(--accent); margin-bottom: 1px; }
#report .bad { color: var(--rose); }

/* Dialogue */
#dialog { position: absolute; left: 10px; right: 10px; bottom: 9px; min-height: 52px; display: flex; gap: 8px; padding: 6px 7px; box-sizing: border-box; }
.dtext { flex: 1; min-width: 0; position: relative; }
#dline { margin: 0; font-size: 8.5px; line-height: 1.28; }
#dline.narr { font-style: italic; color: #5a4430; }
#dchoices { display: flex; gap: 6px; margin-top: 4px; }
#dnext { position: absolute; right: 0; bottom: -2px; font-size: 7px; color: var(--wood); animation: bob 0.8s steps(2) infinite; }
@keyframes bob { 50% { transform: translateY(1px); } }
.pframe { flex: none; width: 38px; display: flex; flex-direction: column; align-items: center; gap: 2px; margin-top: -1px; }
#portrait { width: 34px; height: 34px; image-rendering: pixelated; background: #cfe3c4; box-shadow: 0 0 0 1px var(--bark), 0 0 0 2px var(--wood), 0 0 0 3px var(--bark); }
#dname { font-size: 6px; font-weight: 700; color: var(--parch); background: var(--wood); box-shadow: 0 0 0 1px var(--bark); padding: 0 3px; white-space: nowrap; margin-top: 2px; max-width: 60px; overflow: hidden; text-overflow: ellipsis; }

/* Panels */
.shade { position: absolute; inset: 0; background: rgba(29, 42, 28, .62); display: grid; place-items: center; }
.panel { width: 336px; max-height: 188px; box-sizing: border-box; padding: 6px 8px 7px; display: flex; flex-direction: column; gap: 4px; font-size: 7px; }
.panel header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.panel h2 { margin: 0; font-size: 11px; font-weight: 700; color: #6a3a1c; white-space: nowrap; }
.panel header small { text-align: right; }
.panel header small { color: var(--muted); font-size: 6.5px; }
.panel .scroll { overflow-y: auto; min-height: 0; flex: 1; scrollbar-width: thin; padding-right: 2px; }
.panel .x { font-size: 6.5px; padding: 1px 6px; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.bcard { display: flex; flex-direction: column; gap: 2px; padding: 3px; text-align: left; cursor: pointer; border: 0; background: #fbefd2; color: var(--ink); font-family: var(--font);
  box-shadow: 0 0 0 1px var(--parch-dk); min-width: 0; }
.bcard:hover, .bcard:focus-visible { box-shadow: 0 0 0 1px var(--wood); outline: none; background: #fff6dc; }
.bcard.no { opacity: .55; }
.bcard canvas { width: 100%; height: 30px; image-rendering: pixelated; background: #cfe3c4; }
.bcard b { font-size: 7px; color: var(--accent); }
.bcard span { font-size: 6px; color: var(--muted); }
.bcard em { font-style: normal; font-size: 6px; }
.rows { display: grid; gap: 2px; }
.srow { display: grid; grid-template-columns: 18px 1fr 54px 64px 36px; align-items: center; gap: 4px; padding: 1px 2px; cursor: pointer; background: #fbefd2; border: 0; font-family: var(--font); color: var(--ink); text-align: left; font-size: 6.5px; }
.srow:hover, .srow:focus-visible, .srow.sel { background: #fff6dc; outline: 1px solid var(--wood); }
.srow canvas { width: 18px; height: 14px; image-rendering: pixelated; }
.srow b { font-size: 7px; }
.chips { display: flex; gap: 2px; flex-wrap: wrap; }
.chip { font-size: 5.5px; padding: 0 2px; background: var(--parch-dk); color: var(--ink); white-space: nowrap; }
.chip.bad { background: #f2c0b4; }
.chip.good { background: #cfe3c4; }
.minijoy { height: 3px; background: var(--parch-dk); }
.minijoy i { display: block; height: 100%; background: var(--rose); }
.detail { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding-top: 3px; border-top: 1px solid var(--parch-dk); }
.detail .btn { font-size: 6.5px; padding: 1px 5px; }
.summary { display: flex; gap: 8px; flex-wrap: wrap; font-size: 6.5px; color: var(--muted); }
.summary b { color: var(--ink); }
.obj { display: flex; gap: 4px; align-items: baseline; font-size: 7.5px; line-height: 1.3; }
.obj i { font-style: normal; width: 8px; flex: none; color: var(--leaf); font-weight: 700; }
.obj.key { font-weight: 600; }
.obj.done { color: var(--muted); text-decoration: line-through; }
.verse { font-size: 7px; font-style: italic; color: #5a4430; border-left: 2px solid var(--parch-dk); padding-left: 5px; }
#mapc { width: 100%; height: 142px; image-rendering: pixelated; background: #2c4a26; }
.codex { display: grid; grid-template-columns: 112px 1fr; gap: 6px; min-height: 0; flex: 1; }
.codex .list { overflow-y: auto; display: grid; gap: 1px; align-content: start; }
.codex .list button { font-family: var(--font); font-size: 6.5px; text-align: left; border: 0; background: #fbefd2; color: var(--ink); padding: 1px 3px; cursor: pointer; }
.codex .list button.sel, .codex .list button:hover { background: #fff6dc; outline: 1px solid var(--wood); }
.codex .page { overflow-y: auto; font-size: 7.5px; line-height: 1.35; }
.codex .page h3 { margin: 0 0 3px; font-size: 9px; color: #6a3a1c; }
.codex .page cite { display: block; font-style: normal; color: var(--muted); margin-top: 3px; }
.kind { font-size: 5.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
.menu { display: grid; gap: 5px; justify-items: stretch; width: 130px; padding: 8px 10px; }
.menu h2 { text-align: center; }
.menu .btn { font-size: 8px; }

/* Level up */
#levelup { position: absolute; inset: 0; background: rgba(29, 42, 28, .6); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px; }
#levelup h2 { margin: 0; font-size: 13px; font-weight: 700; padding: 2px 10px; }
#cards { display: flex; gap: 8px; }
.card { width: 96px; min-height: 74px; padding: 6px 6px 5px; box-sizing: border-box; text-align: left; cursor: pointer; border: 0; font-family: var(--font); display: flex; flex-direction: column; gap: 3px; }
.card:hover, .card:focus-visible { outline: 1px solid var(--sun); outline-offset: 4px; }
.card b { font-size: 8px; font-weight: 700; color: var(--accent); }
.card span { font-size: 7px; line-height: 1.2; }
.card em { margin-top: auto; font-style: normal; font-size: 6px; color: var(--muted); }
.card.evo { background: #fff3c8; }
.card.evo b { color: #b06a10; }

/* Title, chapter cards, credits */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 7px; }
#title { background: linear-gradient(rgba(29, 42, 28, 0), rgba(29, 42, 28, .55)); }
.sign { padding: 7px 16px 8px; display: grid; gap: 2px; }
#title h1 { margin: 0; font-size: 30px; font-weight: 700; color: #6a3a1c; letter-spacing: .5px; text-shadow: 0 2px 0 var(--parch-dk); }
#title .tag { font-size: 8px; color: var(--ink); }
#title .btns { display: flex; gap: 8px; margin-top: 6px; }
#title .keys { font-size: 6.5px; position: absolute; bottom: 7px; padding: 2px 6px; }
.card2 { padding: 10px 18px 11px; display: grid; gap: 4px; justify-items: center; max-width: 270px; }
.card2 .no { font-size: 7px; font-weight: 600; color: var(--muted); letter-spacing: 1px; }
.card2 h2 { margin: 0; font-size: 16px; font-weight: 700; color: #6a3a1c; }
.card2 p { margin: 3px 0 0; font-size: 8px; max-width: 230px; }
.card2 p cite { display: block; font-style: normal; color: var(--muted); font-size: 7px; margin-top: 2px; }
.card2 .blurb { font-size: 7px; color: #5a4430; }
.card2 ul { margin: 2px 0; padding: 0; list-style: none; font-size: 7px; text-align: left; display: grid; gap: 1px; }
.card2 ul li.done::before { content: "✓ "; color: var(--leaf); font-weight: 700; }
.card2 ul li.miss::before { content: "· "; color: var(--muted); }
.card2 .stats { display: grid; grid-template-columns: auto auto; gap: 1px 12px; font-size: 7.5px; text-align: left; font-variant-numeric: tabular-nums; }
.card2 .stats b { text-align: right; color: var(--accent); }
#chapter, #chend, #end { background: rgba(29, 42, 28, .78); }
#fade { position: absolute; inset: 0; background: #05060c; opacity: 0; transition: opacity 2s; }
#fade.on { opacity: 1; }
#credits { background: #0d1210; overflow: hidden; }
#credits .roll { position: absolute; left: 0; right: 0; top: 100%; display: grid; gap: 4px; justify-items: center; font-size: 8px; color: var(--parch); }
#credits .roll h3 { margin: 10px 0 2px; font-size: 11px; color: var(--sun); }
#credits .roll .names { display: grid; grid-template-columns: repeat(4, 70px); gap: 1px 6px; font-size: 7px; color: #d8c8a8; }
#credits .roll p { margin: 0; max-width: 260px; }
#paused-flag { position: absolute; left: 50%; top: 6px; transform: translateX(-50%); font-size: 7px; padding: 1px 6px; }

@media (prefers-reduced-motion: reduce) {
  #banner.on { animation: none; opacity: 1; }
  .btn.forgive, #dnext { animation: none; }
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="384" height="216" aria-label="Ninety-Nine game screen"></canvas>
  <div id="ui">
    <div id="hud" hidden>
      <div class="xp"><i id="hud-xpbar"></i></div>
      <button class="goal wood" id="hud-goal" type="button" title="All goals (Q)"><span class="lv" id="hud-lv">Lv 1</span><span id="hud-goal-text"></span></button>
      <div class="clock wood" title="Day and time"><span class="sunmoon" id="hud-sun"></span><b id="hud-day">Day 1</b><span class="time" id="hud-time">6:00 am</span><div class="dayfill"><i id="hud-bar"></i></div></div>
      <div class="res wood" id="hud-res"></div>
      <div class="prompt wood" id="prompt" hidden><span id="prompt-text"></span><div class="hold" id="hold" hidden><i id="hold-bar"></i></div></div>
      <div class="tbar" id="tbar" hidden>
        <button class="btn" type="button" data-act="whistle">Whistle</button>
        <button class="btn" type="button" data-act="use">Use</button>
        <button class="btn" type="button" data-act="build">Build</button>
        <button class="btn" type="button" data-act="flock">Flock</button>
        <button class="btn" type="button" data-act="menu">Menu</button>
      </div>
    </div>
    <div id="report" class="wood"></div>
    <div id="toast" class="wood" role="status" aria-live="polite"></div>
    <div id="tip" class="wood"></div>
    <div id="banner"></div>

    <div id="dialog" class="wood clickable" hidden>
      <div class="dtext"><p id="dline"></p><div id="dchoices"></div><span id="dnext">▼</span></div>
      <div class="pframe" id="pframe"><canvas id="portrait" width="34" height="34"></canvas><span id="dname"></span></div>
    </div>

    <div id="lesson" class="shade" hidden></div>
    <div id="levelup" hidden><h2 class="wood">Level up!</h2><div id="cards"></div></div>
    <div id="panel" class="shade" hidden></div>

    <div id="title" class="screen clickable">
      <div class="sign wood"><h1>Ninety-Nine</h1><div class="tag">Leave no sheep behind.</div></div>
      <div class="btns" id="title-btns"></div>
      <div class="keys wood">Move: WASD or arrows · Use: E · Whistle: Space · How to play: H · Menu: Esc</div>
    </div>
    <div id="chapter" class="screen clickable" hidden></div>
    <div id="chend" class="screen" hidden></div>
    <div id="end" class="screen" hidden></div>
    <div id="credits" class="screen" hidden><div class="roll" id="roll"></div></div>
    <div id="fade"></div>
  </div>
</div>
<script src="js/core.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/script.js"></script>
<script src="js/world.js"></script>
