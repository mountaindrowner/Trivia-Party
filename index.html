<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05060f">
  <title>Trivia Holy Party</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Baloo+2:wght@700;800&family=Bangers&family=Cinzel:wght@600;700&family=Chakra+Petch:wght@500;600;700&family=Exo+2:ital,wght@0,600;0,700;0,800;0,900;1,800;1,900&family=Lilita+One&family=Nunito:wght@600;800;900&family=Patrick+Hand&family=Press+Start+2P&family=Oxanium:wght@500;600;700;800&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&family=Teko:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/edge.css">
  <link rel="stylesheet" href="css/cyber.css" id="skin-cyber">
  <link rel="stylesheet" href="css/loot.css" id="skin-loot">
  <link rel="stylesheet" href="css/grit.css">
  <link rel="stylesheet" href="css/scenes.css">
  <link rel="stylesheet" href="css/stories/jonah.css">
  <link rel="stylesheet" href="css/stories/daniel.css">
  <link rel="stylesheet" href="css/stories/noah.css">
  <link rel="stylesheet" href="css/stories/elijah.css">
  <link rel="stylesheet" href="css/stories/tomb.css">
  <link rel="stylesheet" href="css/events.css">
  <link rel="stylesheet" href="css/intro.css">
  <link rel="stylesheet" href="css/church.css">
</head>
<body>
  <!-- Rough-edge filters for the mode borders (css/grit.css): more warp as the modes get harder. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="gf2" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="6"/><feDisplacementMap in="SourceGraphic" scale="1.2" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="gf3" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="2" seed="9"/><feDisplacementMap in="SourceGraphic" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="gf4" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="12"/><feDisplacementMap in="SourceGraphic" scale="3.2" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="gf5" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.11" numOctaves="3" seed="15"/><feDisplacementMap in="SourceGraphic" scale="4.5" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="gf6" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.14" numOctaves="3" seed="18"/><feDisplacementMap in="SourceGraphic" scale="6" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="gf7" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.18" numOctaves="3" seed="21"/><feDisplacementMap in="SourceGraphic" scale="8" xChannelSelector="R" yChannelSelector="G"/></filter>
  </svg>
  <div id="app">
    <div class="sky" aria-hidden="true"><div class="rays"></div><div class="glass"></div>
      <svg class="church" viewBox="0 0 640 420" preserveAspectRatio="xMidYMax meet">
        <!-- Church of the Crossroads, drawn in the game's cartoon style. Colors come from the skin (css/church.css). -->
        <g class="ch-line" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
          <!-- cross tower: a tall rounded arch with the cross inside -->
          <path class="ch-wall" d="M286 132 L286 46 Q286 14 315 14 Q344 14 344 46 L344 132 Z"/>
          <path class="ch-sky" d="M298 132 L298 50 Q298 28 315 28 Q332 28 332 50 L332 132 Z"/>
          <path class="ch-wall" d="M309 46 h12 v30 h16 v11 h-16 v45 h-12 v-45 h-16 v-11 h16 z"/>
          <!-- main sanctuary: tall wall with a steep gable -->
          <path class="ch-wall" d="M40 360 L40 196 L315 128 L520 214 L520 360 Z"/>
          <path class="ch-shade" d="M40 196 L40 360 L70 360 L70 202 Z"/>
          <!-- front entry: lighter recess with an arched door -->
          <path class="ch-wall" d="M262 360 L262 236 L352 222 L352 360 Z"/>
          <path class="ch-dark" d="M286 360 L286 292 Q286 266 307 266 Q328 266 328 292 L328 360 Z"/>
          <!-- side wing with the curved mission parapet and an arched window -->
          <path class="ch-wall" d="M352 360 L352 222 Q352 200 372 200 Q392 200 392 214 L420 214 Q440 214 440 194 Q440 176 464 176 Q488 176 488 196 Q488 214 512 214 Q534 214 534 240 L600 268 L600 360 Z"/>
          <path class="ch-dark" d="M440 270 L440 238 Q440 214 462 214 Q484 214 484 238 L484 270 Z"/>
          <path class="ch-dark" d="M410 276 L410 248 L426 246 L426 276 Z"/>
          <!-- low terracotta roof over the side door -->
          <path class="ch-roof" d="M400 312 L470 286 L560 286 L586 312 Z"/>
          <path class="ch-wall" d="M410 312 L576 312 L576 360 L410 360 Z"/>
          <!-- palm tree -->
          <path class="ch-trunk" d="M500 360 Q498 320 506 282 L516 282 Q510 320 514 360 Z"/>
          <g class="ch-palm">
            <path d="M510 282 Q470 262 440 280 Q474 268 510 286 Z"/><path d="M510 282 Q478 240 446 236 Q480 252 508 288 Z"/>
            <path d="M510 282 Q520 236 552 224 Q528 250 514 286 Z"/><path d="M512 282 Q556 260 588 272 Q556 270 514 288 Z"/>
            <path d="M510 284 Q540 300 552 330 Q532 302 508 290 Z"/><path d="M508 284 Q478 296 470 322 Q488 298 510 290 Z"/>
          </g>
          <!-- lawn, bushes and the sign wall -->
          <path class="ch-grass" d="M0 352 Q320 340 640 352 L640 420 L0 420 Z"/>
          <g class="ch-bush"><ellipse cx="62" cy="356" rx="46" ry="22"/><ellipse cx="120" cy="362" rx="38" ry="18"/><ellipse cx="596" cy="360" rx="40" ry="18"/></g>
          <path class="ch-wall" d="M140 400 L140 330 L566 330 L566 400 Z"/>
          <path class="ch-shade" d="M150 340 L556 340 L556 392 L150 392 Z"/>
          <g class="ch-bush"><ellipse cx="236" cy="398" rx="62" ry="18"/><ellipse cx="300" cy="402" rx="30" ry="12"/></g>
        </g>
        <text class="ch-signtext" x="353" y="376" text-anchor="middle">CHURCH OF THE CROSSROADS</text>
      </svg>
    </div>

    <header class="hud" id="hud" hidden>
      <div class="hud-group">
        <div class="lamps" id="lamps" role="img" aria-label="Lamp oil"></div>
        <span class="lost-badge" id="lost-badge" hidden>Lost sheep</span>
        <span class="streak" id="streak" hidden></span>
      </div>
      <div class="hud-group">
        <span class="hud-pill" id="progress">1 / 8</span>
        <span class="hud-pill coin"><span class="coin-dot" aria-hidden="true"></span><span id="score">0</span></span>
        <button class="hud-btn" id="music" aria-label="Music off">🎵</button>
        <button class="hud-btn" id="mute" aria-label="Mute">🔊</button>
      </div>
    </header>

    <aside class="host" id="host" data-mood="happy" aria-live="polite">
      <svg class="donkey" viewBox="0 0 200 210" aria-hidden="true">
        <g class="ears">
          <g class="ear ear-l"><ellipse cx="62" cy="52" rx="17" ry="46" transform="rotate(-20 62 52)" class="fur"/><ellipse cx="62" cy="56" rx="8" ry="32" transform="rotate(-20 62 56)" class="ear-in"/></g>
          <g class="ear ear-r"><ellipse cx="138" cy="52" rx="17" ry="46" transform="rotate(20 138 52)" class="fur"/><ellipse cx="138" cy="56" rx="8" ry="32" transform="rotate(20 138 56)" class="ear-in"/></g>
        </g>
        <path class="scarf" d="M48 176 Q100 206 152 176 L160 200 Q100 222 40 200 Z"/>
        <path class="scarf-stripe" d="M44 188 Q100 214 156 188"/>
        <ellipse cx="100" cy="112" rx="60" ry="62" class="fur"/>
        <path class="mane" d="M78 56 Q86 34 98 50 Q106 30 114 52 Q126 40 124 62 Q100 54 78 56Z"/>
        <ellipse cx="100" cy="158" rx="46" ry="32" class="muzzle"/>
        <ellipse cx="84" cy="150" rx="5" ry="7" class="ink"/>
        <ellipse cx="116" cy="150" rx="5" ry="7" class="ink"/>
        <g class="eyes">
          <circle cx="76" cy="104" r="15" class="eye-white"/><circle cx="124" cy="104" r="15" class="eye-white"/>
          <circle cx="78" cy="107" r="7" class="ink"/><circle cx="122" cy="107" r="7" class="ink"/>
          <circle cx="81" cy="103" r="2.5" class="glint"/><circle cx="125" cy="103" r="2.5" class="glint"/>
        </g>
        <g class="shades">
          <path class="shades-bridge" d="M90 102 Q100 96 110 102"/>
          <path class="shades-lens" d="M54 94 H94 Q96 116 80 120 Q60 121 56 108 Z"/>
          <path class="shades-lens" d="M106 94 H146 Q144 108 140 112 Q134 121 120 120 Q104 116 106 94 Z"/>
          <path class="shades-shine" d="M62 99 L72 99"/><path class="shades-shine" d="M114 99 L124 99"/>
        </g>
        <g class="cap">
          <path class="cap-crown" d="M56 72 Q56 30 100 28 Q144 30 144 72 Q100 60 56 72 Z"/>
          <path class="cap-brim" d="M126 64 Q164 52 186 66 Q170 80 130 76 Z"/>
          <circle class="cap-button" cx="100" cy="29" r="5"/>
          <path class="cap-logo" d="M100 38 V58 M92 45 H108"/>
        </g>
        <path class="brow brow-l" d="M62 84 Q76 76 90 82"/>
        <path class="brow brow-r" d="M110 82 Q124 76 138 84"/>
        <path class="mouth-closed" d="M82 172 Q100 184 118 172"/>
        <ellipse class="mouth-open" cx="100" cy="176" rx="15" ry="9"/>
        <ellipse cx="62" cy="130" rx="9" ry="5" class="blush"/><ellipse cx="138" cy="130" rx="9" ry="5" class="blush"/>
      </svg>
      <div class="bubble" id="bubble">
        <p class="host-name">Barnabas</p>
        <p id="bubble-text"></p>
        <button class="bubble-next" id="bubble-next" hidden aria-label="Next">Next ▶</button>
      </div>
    </aside>

    <main id="stage"></main>
    <div id="fx" aria-hidden="true"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/data-modes.js"></script>
  <!-- The content expansion: about twice as many questions again, one file per mode. -->
  <script src="js/more/l1.js"></script>
  <script src="js/more/l2.js"></script>
  <script src="js/more/l3.js"></script>
  <script src="js/more/l4.js"></script>
  <script src="js/more/l5.js"></script>
  <script src="js/more/l6.js"></script>
  <script src="js/more/l7.js"></script>
  <script src="js/more/final.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/music.js"></script>
  <script src="js/core.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/stories/jonah.js"></script>
  <script src="js/stories/daniel.js"></script>
  <script src="js/stories/noah.js"></script>
  <script src="js/stories/elijah.js"></script>
  <script src="js/stories/tomb.js"></script>
  <script src="js/minigames.js"></script>
  <script src="js/game.js"></script>
  <script src="js/versus.js"></script>
  <script src="js/daily.js"></script>
  <script src="js/holiday.js"></script>
  <script src="js/intro.js"></script>
</body>
</html>
