# Runs the repo's checks on every push and pull request: lint (JavaScript, CSS, Python), the content check,
# the build, and the room-server tests against local copies of both sites. Same as `npm run check` plus Ruff.
name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            huddle/server/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm ci
        working-directory: huddle/server
      - run: pip install ruff==0.14.0
      - name: Lint
        run: npm run lint && ruff check .
      - name: Content
        run: npm run check:content
      - name: Build the pages
        run: npm run build
      - name: Room server tests
        run: npm run test:relay
        env:
          WRANGLER_SEND_METRICS: "false"
